<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive Wuzz • Compact</title>
<style>
:root{--outer:#e8e2d8;--bg:#f6f2eb;--card:#fff;--border:#e8e0d4;--text:#1e1c18;--muted:#8f8a82;--pill:#f2ece3;--accent:#ff3b30}
*{box-sizing:border-box}body{margin:0;background:var(--outer);color:var(--text);font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:20;background:rgba(232,226,216,.9);backdrop-filter:blur(12px);border-bottom:1px solid #d9d0c2;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(255,59,48,.12)}
.brand b{font-size:12px;letter-spacing:.1em;font-weight:900}
select{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700}
.wrap{max-width:540px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border)}
#log{padding:6px 14px;font-size:10px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--border)}
#list{padding:8px 10px 20px}
/* COMPACT CARD - tinggi konsisten 88px */
.item{display:flex;flex-direction:column;justify-content:center;min-height:88px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin:7px 0;text-decoration:none;color:inherit}
.item:active{transform:scale(.99)}
.meta{font-size:10px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.meta b{color:var(--text)}
.title{font-size:13.5px;line-height:1.3;font-weight:700;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* 1 baris saja */
.sum{font-size:11.5px;line-height:1.3;color:#6a6660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* 1 baris saja */
.foot{display:flex;gap:6px;margin-top:6px}
.pill{background:var(--pill);border-radius:99px;padding:2px 7px;font-size:9.5px;font-weight:800;color:#6b6560}
#more{width:calc(100% - 20px);margin:0 auto 20px;display:block;border:1px solid var(--border);background:var(--card);border-radius:99px;padding:11px;font-weight:800;font-size:12px}
@media(max-width:600px){.wrap{max-width:100%;border:0}#list{padding:6px 8px}.item{margin:6px 0;min-height:84px}}
</style>
</head>
<body>
<div class="top"><div class="brand"><span class="dot"></span><b>HIVE • WUZZ COMPACT</b></div><select id="sort"><option value="created">Newest</option><option value="trending">Trending</option><option value="hot">Hot</option></select></div>
<div class="wrap"><div id="log">compact • 1 layar 6 post</div><div id="list"></div><button id="more">Load 10 lagi ↓</button></div>
<script>
let sort='created',allPosts=[],displayed=0,busy=false,lastAuthor='',lastPermlink='',seen=new Set();
const listEl=document.getElementById('list'),logEl=document.getElementById('log'),moreBtn=document.getElementById('more'),sortEl=document.getElementById('sort');
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ago(v){let d=new Date(v+'Z');if(isNaN(d))d=new Date(v);let s=Math.floor((Date.now()-d)/1000);if(s<60)return s+'d';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'j';return Math.floor(s/86400)+'h';}
async function fetchTimeout(url,body,to=3800){let c=new AbortController();let t=setTimeout(()=>c.abort(),to);try{let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(t);}}
async function hiveFetchBatch(isNext){
  let method=`condenser_api.get_discussions_by_${sort}`;
  let params={tag:'',limit:20}; if(isNext&&lastAuthor){params.start_author=lastAuthor; params.start_permlink=lastPermlink;}
  let body={jsonrpc:'2.0',method,params:[params],id:1};
  let eps=['https://api.hive.blog','https://api.deathwing.me','https://api.openhive.network'];
  let promises=eps.map(async url=>{try{let j=await fetchTimeout(url,body,3800); if(j.error)throw new Error(j.error.message); if(Array.isArray(j.result))return j.result; throw new Error('invalid');}catch(e){throw new Error('x');}});
  let data=await Promise.any(promises); if(isNext&&data.length) data=data.slice(1); return data;
}
function addToCache(posts){for(let p of posts){let k=p.author+'/'+p.permlink; if(!seen.has(k)){seen.add(k); allPosts.push(p);}} if(posts.length){let l=posts[posts.length-1]; lastAuthor=l.author; lastPermlink=l.permlink;}}
function render10(){
  let next=allPosts.slice(displayed,displayed+10); if(!next.length) return false;
  let h='';for(let x of next){
    let payout=parseFloat(String(x.pending_payout_value||'').replace(/[^\d.]/g,''))||0;
    let body=String(x.body||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
    let likes=x.active_votes?x.active_votes.length:(x.net_votes||0);
    h+=`<a class="item" href="https://peakd.com/@${esc(x.author)}/${esc(x.permlink)}" target="_blank"><div class="meta"><b>@${esc(x.author.slice(0,16))}</b><span>•</span><span>${ago(x.created)}</span><span>•</span><span>#${esc((x.category||'hive').slice(0,10))}</span></div><div class="title">${esc(x.title||'(tanpa judul)')}</div><div class="sum">${esc(body)}</div><div class="foot"><span class="pill">💬 ${x.children??0}</span><span class="pill">♥ ${likes}</span><span class="pill">$${payout.toFixed(2)}</span></div></a>`;
  }
  listEl.insertAdjacentHTML('beforeend',h); displayed+=next.length;
  logEl.textContent=`${displayed}/${allPosts.length} • ${sort}`;
  if(allPosts.length-displayed<12) loadBatch(true);
  return true;
}
async function loadBatch(isNext){if(busy)return; busy=true; moreBtn.textContent='...'; try{let d=await hiveFetchBatch(isNext); addToCache(d); render10();}catch(e){logEl.textContent='ERROR';}finally{busy=false; moreBtn.textContent='Load 10 lagi ↓';}}
async function reset(){allPosts=[]; displayed=0; lastAuthor=''; lastPermlink=''; seen=new Set(); listEl.innerHTML=''; await loadBatch(false);}
sortEl.onchange=()=>{sort=sortEl.value; reset();}; moreBtn.onclick=async()=>{if(displayed<allPosts.length)render10(); else await loadBatch(true);}; reset();
</script>
</body>
</html>
