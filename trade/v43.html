<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIVE ENGINE - V4.3 MODE SWITCH</title>
<script src="https://unpkg.com/@hiveio/hive-js@latest/dist/hive.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0c;color:#e6e8ea;font-family:'Inter',sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;background:radial-gradient(600px at 50% -100px, #1a2a22 0%, transparent 60%), #080a0c}
.header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.header h3{margin:0;font-size:16px;font-weight:800}
.header span{font-size:10px;background:#1a1e22;border:1px solid #2a2f35;padding:4px 8px;border-radius:20px;color:#7a7f85}
.card{background:linear-gradient(180deg,#1c2126 0%,#161a1e 100%);border:1px solid #23282e;border-radius:18px;padding:16px;margin:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
label{display:block;font-size:10px;color:#7a7f85;font-weight:700;letter-spacing:.8px;margin-top:12px;text-transform:uppercase}
input,select{width:100%;padding:13px 14px;margin-top:6px;border-radius:12px;border:1px solid #2a2f35;background:#0d0f11;color:#fff;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:800;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn-g{background:#00ff88;color:#000;box-shadow:0 4px 15px rgba(0,255,136,.3)}
.btn-r{background:#ff3b4a;color:#fff;box-shadow:0 4px 15px rgba(255,59,74,.25)}
.btn-d{background:#242a30;color:#d0d4d8}
.btn-kc{background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000}
.btn-logout{background:#2a1a1e;color:#ff6b7a;border:1px solid #3a2025;padding:6px 12px;font-size:11px;width:auto;border-radius:20px}
.btn-mode{border:1px solid #2a2f35;background:#0d0f11;color:#7a7f85}
.btn-mode.active-buy{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,.3)}
.btn-mode.active-sell{background:#ff3b4a;color:#fff;border-color:#ff3b4a;box-shadow:0 0 15px rgba(255,59,74,.3)}
.status{padding:12px;border-radius:12px;background:#0d0f11;border:1px solid #22272d;margin-top:10px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-family:'JetBrains Mono',monospace}
.pill{background:#1e2429;border:1px solid #2a2f35;padding:5px 10px;border-radius:20px;font-size:11px;display:inline-block;margin:3px;font-family:'JetBrains Mono'}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small-row{display:flex;gap:8px;margin-top:8px}
.hidden{display:none!important}
.success{color:#00ff88}.warning{color:#ffd166}.error{color:#ff6b6b}
.market-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{font-size:10px;padding:4px 8px;border-radius:8px;background:#0d0f11;border:1px solid #2a2f35;color:#7a7f85}
.divider{height:1px;background:linear-gradient(90deg,transparent,#23282e,transparent);margin:14px 0}
.connected-bar{display:flex;justify-content:space-between;align-items:center;background:#0f1a14;border:1px solid #1e3a28;padding:12px 14px;border-radius:12px;margin-top:8px}
.check-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:#7a7f85}
.check-row input{width:16px;height:16px;margin:0}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h3>HIVE ENGINE • V4.3</h3>
<div style="display:flex;gap:6px;align-items:center">
<span id="kcDetect">CHECKING...</span>
<button id="logoutBtn" onclick="doLogout()" class="btn btn-logout hidden">LOGOUT</button>
</div>
</div>

<div class="card">
<div id="connectedBar" class="connected-bar hidden">
<div><div style="font-size:10px;color:#7a7f85">TERHUBUNG</div><b id="connectedUser">@-</b><div id="connectedMode" style="font-size:10px;color:#7a7f85">-</div></div>
<button onclick="doLogout()" class="btn btn-logout">LOGOUT</button>
</div>

<div id="kcSection">
<label>Hive Keychain Login</label>
<input id="user" placeholder="masabqory" autocomplete="off" spellcheck="false">
<button id="kcBtn" onclick="loginKC()" class="btn btn-kc" style="margin-top:10px">🔑 LOGIN KEYCHAIN</button>
<div id="kcStatus" class="status">Mendeteksi Keychain...</div>
</div>

<div id="manualSection" class="hidden">
<label>Manual Login</label>
<input id="userManual" placeholder="username hive" autocomplete="off" spellcheck="false">
<input id="key" type="password" placeholder="5J... Active Private Key" style="margin-top:8px">
<button id="loadBtn" class="btn btn-d" style="margin-top:10px">HUBUNGKAN MANUAL</button>
<div id="manualStatus" class="status">Mode manual</div>
</div>

<div id="info" class="status">Belum terhubung.</div>
<div class="check-row"><input type="checkbox" id="showZero"><label for="showZero" style="margin:0;text-transform:none;letter-spacing:0;font-size:11px">Tampilkan saldo 0</label></div>
<div id="bals" style="margin-top:10px"></div>
</div>

<div class="card hidden" id="tradeCard">
<div class="market-head"><label style="margin:0">Market</label><span class="badge" id="pairBadge">-</span></div>
<select id="tokenSelect"></select>
<div id="pair" class="status">-</div>
<div class="divider"></div>

<label>Mode Trading</label>
<div class="row" style="margin-top:6px">
<button id="btnBuyMode" class="btn btn-mode active-buy" onclick="setTradeMode('buy')">🟢 BELI</button>
<button id="btnSellMode" class="btn btn-mode" onclick="setTradeMode('sell')">🔴 JUAL</button>
</div>

<label>Jumlah Token</label>
<input id="qty" type="number" step="any" min="0" placeholder="1000">
<div class="small-row">
<button class="btn btn-d" id="maxBtn">MAX</button>
</div>

<label>Buffer Slippage</label>
<select id="slip"><option value="1">1% Hemat</option><option value="2" selected>2% Aman</option><option value="5">5% Agresif</option></select>
<div id="calcInfo" class="status">Isi jumlah token.</div>

<button id="mainTradeBtn" class="btn btn-g" style="margin-top:12px;font-size:16px;padding:16px">BUY MARKET</button>

<div id="tradeLog" class="status">Siap.</div>
<div class="row" style="margin-top:10px">
<button id="refreshBtn" class="btn btn-d">↻ REFRESH</button>
<button id="clearBtn" class="btn btn-d" style="background:#3a1a1a">HAPUS</button>
</div>
</div>
</div>

<script>
const ENGINE_API="https://api.hive-engine.com/rpc/contracts";
hive.api.setOptions({url:"https://api.hive.blog"});
const $=id=>document.getElementById(id);
let account="", activeKey="", ownedMap={}, currentToken="", sellBook=[], buyBook=[], tokenPrecision=8, mySwapHive=0, myTokenBalance=0, busy=false, useKeychain=false, tradeMode="buy";
const LS_SET="he_v43_settings", LS_CONN="he_v43_connected", LS_USER="he_v43_user", LS_MODE="he_v43_mode", LS_AKEY="he_v43_akey", LS_TMODE="he_v43_tmode", LS_SHOWZERO="he_v43_showzero";

function saveSettings(){
  localStorage.setItem(LS_SET, JSON.stringify({token:currentToken,qty:$("qty").value,slip:$("slip").value,showZero:$("showZero").checked,tradeMode}));
  if(tradeMode) localStorage.setItem(LS_TMODE, tradeMode);
  localStorage.setItem(LS_SHOWZERO, $("showZero").checked?"1":"0");
}
function getSettings(){try{return JSON.parse(localStorage.getItem(LS_SET)||"{}")}catch(e){return {}}}
function saveConnection(){
  localStorage.setItem(LS_CONN,"1");
  localStorage.setItem(LS_USER,account);
  localStorage.setItem(LS_MODE,useKeychain?"keychain":"manual");
  if(!useKeychain && activeKey) localStorage.setItem(LS_AKEY,btoa(activeKey));
  saveSettings();
}
function clearConnection(){
  localStorage.removeItem(LS_CONN); localStorage.removeItem(LS_USER); localStorage.removeItem(LS_MODE); localStorage.removeItem(LS_AKEY); localStorage.removeItem(LS_SET); localStorage.removeItem(LS_TMODE); localStorage.removeItem(LS_SHOWZERO);
}

// FORCE LOWERCASE NO SPACE
function forceLowercase(el){
  let v=el.value.toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9.-]/g,"");
  if(el.value!==v) el.value=v;
}
$("user").addEventListener("input", function(){forceLowercase(this);});
$("userManual").addEventListener("input", function(){forceLowercase(this);});

function showConnectedUI(){
  $("kcSection").classList.add("hidden");
  $("manualSection").classList.add("hidden");
  $("connectedBar").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("connectedUser").textContent="@"+account;
  $("connectedMode").textContent=useKeychain?"KEYCHAIN MODE":"MANUAL MODE";
  $("info").innerHTML=`<span class="success">● CONNECTED</span> @${account} | HIVE:${mySwapHive}`;
  $("tradeCard").classList.remove("hidden");
  updateMainBtn();
}
function showDisconnectedUI(){
  $("connectedBar").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("tradeCard").classList.add("hidden");
  $("bals").innerHTML="";
  checkKC();
}
function isKC(){return typeof window.hive_keychain!=='undefined' && window.hive_keychain!==null;}
function setDetect(t,ok){$("kcDetect").textContent=t; $("kcDetect").style.color=ok?"#00ff88":"#ff6b6b";}
function showKeychainMode(){
  if(localStorage.getItem(LS_CONN)) return;
  $("kcSection").classList.remove("hidden");
  $("manualSection").classList.add("hidden");
  setDetect("KEYCHAIN OK",true);
}
function showManualMode(){
  if(localStorage.getItem(LS_CONN)) return;
  $("kcSection").classList.add("hidden");
  $("manualSection").classList.remove("hidden");
  setDetect("MANUAL MODE",false);
}
function checkKC(){if(localStorage.getItem(LS_CONN)) return; if(isKC()) showKeychainMode(); else showManualMode();}
window.addEventListener('hive_keychain_ready',()=>{checkKC();});
let tries=0; let iv=setInterval(()=>{tries++; if(isKC()){clearInterval(iv); checkKC();} if(tries>20){clearInterval(iv); checkKC();}},300);

async function rpc(m,p){let r=await fetch(ENGINE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",method:m,params:p,id:1})}); let j=await r.json(); if(j.error) throw new Error(j.error.message); return j.result;}

async function loadBalances(){
 let balances=await rpc("find",{contract:"tokens",table:"balances",query:{account},limit:1000});
 ownedMap={}; balances.forEach(i=>ownedMap[i.symbol]=parseFloat(i.balance)||0);
 mySwapHive=ownedMap["SWAP.HIVE"]||0;
 let showZero=$("showZero").checked;
 let entries=Object.entries(ownedMap).filter(([s,b])=>s!=="SWAP.HIVE");
 if(!showZero) entries=entries.filter(([s,b])=>b>0.0000001);
 entries.sort((a,b)=>b[1]-a[1]);
 $("bals").innerHTML=entries.map(i=>`<span class="pill">★ ${i[0]}: ${i[1]}</span>`).join("")||`<span class="pill">Tidak ada token >0</span>`;
 // tokenSelect tetap tampilkan semua yang >0, plus top
 let ownedForSelect=Object.entries(ownedMap).filter(([s])=>s!=="SWAP.HIVE").sort((a,b)=>b[1]-a[1]);
 let html=""; ownedForSelect.forEach(([s,b])=>{if(showZero||b>0) html+=`<option value="${s}">★ ${s} — ${b}</option>`;});
 html+=`<option disabled>────────</option><option value="LEO">LEO</option><option value="VYB">VYB</option><option value="BEE">BEE</option>`;
 $("tokenSelect").innerHTML=html;
 let set=getSettings(); currentToken=set.token||ownedForSelect[0]?.[0]||"VYB";
 if($("tokenSelect").querySelector(`option[value="${currentToken}"]`)) $("tokenSelect").value=currentToken; else currentToken=ownedForSelect[0]?.[0]||"VYB";
}

async function loadMarket(){
 if(!currentToken) return; $("pair").textContent="Loading...";
 let r=await Promise.all([
  rpc("find",{contract:"market",table:"sellBook",query:{symbol:currentToken},limit:100,indexes:[{index:"priceDec",descending:false}]}),
  rpc("find",{contract:"market",table:"buyBook",query:{symbol:currentToken},limit:100,indexes:[{index:"priceDec",descending:true}]}),
  rpc("findOne",{contract:"tokens",table:"tokens",query:{symbol:currentToken}})
 ]);
 sellBook=r[0]||[]; buyBook=r[1]||[]; tokenPrecision=r[2]?.precision||8; myTokenBalance=ownedMap[currentToken]||0;
 $("pair").textContent=`${currentToken} ASK:${sellBook[0]?.price||'-'} BID:${buyBook[0]?.price||'-'} | ${myTokenBalance} | HIVE:${mySwapHive}`;
 $("pairBadge").textContent=currentToken+"/HIVE"; calculate();
}

function setTradeMode(mode){
  tradeMode=mode;
  $("btnBuyMode").classList.toggle("active-buy", mode==="buy");
  $("btnBuyMode").classList.toggle("active-sell", false);
  $("btnSellMode").classList.toggle("active-sell", mode==="sell");
  $("btnSellMode").classList.toggle("active-buy", false);
  if(mode==="buy"){ $("btnBuyMode").classList.add("active-buy"); } else { $("btnBuyMode").classList.remove("active-buy"); }
  saveSettings();
  calculate();
  updateMainBtn();
}
function updateMainBtn(){
  let qty=parseFloat($("qty").value)||0;
  let txt=qty>0?`${qty} ${currentToken}`:currentToken;
  if(tradeMode==="buy"){
    $("mainTradeBtn").className="btn btn-g";
    $("mainTradeBtn").textContent=`BUY ${txt}`;
    $("mainTradeBtn").onclick=buyMarket;
  }else{
    $("mainTradeBtn").className="btn btn-r";
    $("mainTradeBtn").textContent=`SELL ${txt}`;
    $("mainTradeBtn").onclick=sellMarket;
  }
}

function calculate(){
 let qty=parseFloat($("qty").value)||0; if(!(qty>0)){$("calcInfo").textContent="Isi jumlah token."; updateMainBtn(); return;}
 let slip=(parseFloat($("slip").value)||0)/100; let rem=qty; let cost=0;
 for(let o of sellBook){if(rem<=0) break; let q=parseFloat(o.quantity)||0, p=parseFloat(o.price)||0; let take=Math.min(rem,q); cost+=take*p; rem-=take;}
 let buyOk=rem<=0; let budget=cost*(1+slip);
 rem=qty; let sellVal=0; for(let o of buyBook){if(rem<=0) break; let q=parseFloat(o.quantity)||0, p=parseFloat(o.price)||0; let take=Math.min(rem,q); sellVal+=take*p; rem-=take;}
 let sellOk=rem<=0;
 if(tradeMode==="buy"){
   $("calcInfo").textContent=`BELI ${qty} ${currentToken}\nBiaya: ${cost.toFixed(8)} HIVE | Budget ${slip*100}%: ${budget.toFixed(8)} ${buyOk?"✅":"❌ Book tipis"}\nSaldo HIVE: ${mySwapHive} ${budget>mySwapHive?"❌ KURANG":"✅ CUKUP"}`;
 }else{
   $("calcInfo").textContent=`JUAL ${qty} ${currentToken}\nEstimasi: ${sellVal.toFixed(8)} HIVE ${sellOk?"✅":"❌ Book tipis"}\nSaldo Token: ${myTokenBalance} ${qty>myTokenBalance?"❌ KURANG":"✅ CUKUP"}`;
 }
 $("calcInfo").dataset.budget=budget; $("calcInfo").dataset.buyOk=buyOk; $("calcInfo").dataset.sellOk=sellOk; $("calcInfo").dataset.sellVal=sellVal;
 saveSettings(); updateMainBtn();
}

function setMax(){
  if(tradeMode==="sell"){
    // JUAL MAX = semua token yang dimiliki
    $("qty").value=myTokenBalance;
  }else{
    // BELI MAX = perkiraan token yang bisa dibeli dengan SWAP.HIVE
    let slip=(parseFloat($("slip").value)||0)/100;
    let budget=mySwapHive/(1+slip);
    let amt=0;
    for(let o of sellBook){
      if(budget<=0) break;
      let q=parseFloat(o.quantity)||0, p=parseFloat(o.price)||0;
      let c=q*p;
      if(c<=budget){amt+=q; budget-=c;}else{amt+=budget/p; break;}
    }
    $("qty").value=Math.floor(amt);
  }
  calculate();
}

function loginKC(){
 if(!isKC()){alert("Buka di APK Keychain Browser"); return;}
 let username=$("user").value.trim().toLowerCase().replace(/\s+/g,""); if(username.length<3){let saved=localStorage.getItem(LS_USER); if(saved) username=saved; else{username=prompt("Username:"); if(!username) return; username=username.toLowerCase().replace(/\s+/g,"");}}
 $("kcBtn").disabled=true; $("kcBtn").textContent="MENUNGGU...";
 window.hive_keychain.requestSignBuffer(username, "login-"+Date.now(), "Posting", async function(res){
  $("kcBtn").disabled=false; $("kcBtn").textContent="🔑 LOGIN KEYCHAIN";
  if(res.success){
   account=username.toLowerCase(); useKeychain=true; activeKey="";
   try{await loadBalances(); saveConnection(); showConnectedUI(); await loadMarket();}catch(e){$("info").textContent=e.message;}
  }else{$("kcStatus").textContent="GAGAL: "+res.message;}
 });
}
async function connectManual(){
 let u=($("userManual").value.trim()||$("user").value.trim()).toLowerCase().replace(/\s+/g,""); let k=$("key").value.trim();
 if(u.length<3){$("info").textContent="Username invalid"; return;} if(k.length<40){$("manualStatus").textContent="Active Key 5J... invalid"; return;}
 account=u; activeKey=k; useKeychain=false;
 $("loadBtn").disabled=true;
 try{await loadBalances(); saveConnection(); showConnectedUI(); await loadMarket();}catch(e){$("info").textContent=e.message;}
 finally{$("loadBtn").disabled=false;}
}
function broadcast(jsonPayload, onSuccess, onError){
 if(useKeychain && isKC()){
  window.hive_keychain.requestCustomJson(account, "ssc-mainnet-hive", "Active", jsonPayload, "Hive Engine Trade", function(res){ if(res.success) onSuccess(res); else onError(new Error(res.message)); });
 }else{
  hive.broadcast.customJson(activeKey,[account],[],"ssc-mainnet-hive",jsonPayload,function(err,res){ if(err) onError(err); else onSuccess(res); });
 }
}
async function pollAfterTx(oldHive, oldToken, t){
 if(t>=7){await loadBalances(); await loadMarket(); return;}
 t++; $("tradeLog").textContent=`⏳ Block ${t}/7 HIVE ${oldHive}->${mySwapHive}...`;
 setTimeout(async()=>{await loadBalances(); if(mySwapHive!==oldHive || (ownedMap[currentToken]||0)!==oldToken){$("tradeLog").innerHTML=`<span class="success">✓ UPDATED</span> HIVE ${oldHive}->${mySwapHive}`; await loadMarket();}else pollAfterTx(oldHive, oldToken, t);},3000);
}
async function buyMarket(){
 if(busy) return; let qty=parseFloat($("qty").value)||0; if(!(qty>0)){$("tradeLog").textContent="Isi jumlah"; return;}
 let budget=parseFloat($("calcInfo").dataset.budget||0); let ok=$("calcInfo").dataset.buyOk==="true";
 if(!ok){$("tradeLog").textContent="Book ASK tipis"; return;} if(budget>mySwapHive){$("tradeLog").textContent="HIVE kurang"; return;}
 // NO POPUP
 busy=true; $("mainTradeBtn").disabled=true;
 let oldHive=mySwapHive, oldToken=ownedMap[currentToken]||0;
 let json=JSON.stringify({contractName:"market",contractAction:"marketBuy",contractPayload:{symbol:currentToken,quantity:budget.toFixed(8)}});
 $("tradeLog").textContent=`BUY ${qty} ${currentToken} sending...`;
 broadcast(json, function(r){$("tradeLog").innerHTML=`<span class="success">BUY OK</span> ${r.id||'ok'}`; busy=false; $("mainTradeBtn").disabled=false; pollAfterTx(oldHive, oldToken, 0);}, function(e){$("tradeLog").textContent="GAGAL: "+e.message; busy=false; $("mainTradeBtn").disabled=false;});
}
async function sellMarket(){
 if(busy) return; let qty=parseFloat($("qty").value)||0; if(!(qty>0)){$("tradeLog").textContent="Isi jumlah"; return;} if(qty>myTokenBalance){$("tradeLog").textContent="Token kurang"; return;}
 let ok=$("calcInfo").dataset.sellOk==="true"; if(!ok){$("tradeLog").textContent="Book BID tipis"; return;}
 busy=true; $("mainTradeBtn").disabled=true;
 let oldHive=mySwapHive, oldToken=ownedMap[currentToken]||0;
 let json=JSON.stringify({contractName:"market",contractAction:"marketSell",contractPayload:{symbol:currentToken,quantity:qty.toFixed(tokenPrecision)}});
 $("tradeLog").textContent=`SELL ${qty} sending...`;
 broadcast(json, function(r){$("tradeLog").innerHTML=`<span class="success">SELL OK</span> ${r.id||'ok'}`; busy=false; $("mainTradeBtn").disabled=false; pollAfterTx(oldHive, oldToken, 0);}, function(e){$("tradeLog").textContent="GAGAL: "+e.message; busy=false; $("mainTradeBtn").disabled=false;});
}
function doLogout(){clearConnection(); account=""; activeKey=""; useKeychain=false; ownedMap={}; $("user").value=""; $("userManual").value=""; $("key").value=""; $("qty").value=""; showDisconnectedUI(); $("info").textContent="Logged out.";}

$("loadBtn").onclick=connectManual;
$("tokenSelect").onchange=async function(){currentToken=this.value; saveSettings(); await loadMarket();};
$("qty").oninput=calculate; $("slip").onchange=calculate; $("showZero").onchange=function(){saveSettings(); loadBalances();};
$("maxBtn").onclick=setMax;
$("refreshBtn").onclick=async()=>{try{await loadBalances(); await loadMarket();}catch(e){}};
$("clearBtn").onclick=doLogout;

window.addEventListener('load', async()=>{
  let set=getSettings();
  if(set.qty) $("qty").value=set.qty; if(set.slip) $("slip").value=set.slip;
  if(set.showZero!==undefined) $("showZero").checked=set.showZero; else $("showZero").checked=localStorage.getItem(LS_SHOWZERO)==="1";
  if(set.tradeMode) tradeMode=set.tradeMode; else if(localStorage.getItem(LS_TMODE)) tradeMode=localStorage.getItem(LS_TMODE);
  setTradeMode(tradeMode);

  if(localStorage.getItem(LS_CONN) && localStorage.getItem(LS_USER)){
    let savedUser=localStorage.getItem(LS_USER); let savedMode=localStorage.getItem(LS_MODE); let savedAkey=localStorage.getItem(LS_AKEY);
    account=savedUser;
    if(savedMode==="manual" && savedAkey){try{activeKey=atob(savedAkey); useKeychain=false;}catch(e){clearConnection(); checkKC(); return;}}else{useKeychain=true;}
    let wait=0; while(wait<15 && savedMode==="keychain" &&!isKC()){await new Promise(r=>setTimeout(r,200)); wait++;}
    try{await loadBalances(); showConnectedUI(); setDetect(savedMode==="keychain"?"KEYCHAIN OK":"MANUAL MODE", savedMode==="keychain"); await loadMarket(); $("info").innerHTML=`<span class="success">● AUTO CONNECTED</span> @${account}`;}catch(e){$("info").textContent="Auto-connect gagal: "+e.message;}
  }else{checkKC();}
});
</script>
</body>
</html>
