<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIVE ENGINE - V5.1 DUMP ALL</title>
<script src="https://unpkg.com/@hiveio/hive-js@latest/dist/hive.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0c;color:#e6e8ea;font-family:'Inter',sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:radial-gradient(800px at 50% -200px, #2a1a1a 0%, transparent 60%), #080a0c;padding-bottom:20px}
.header{padding:18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:rgba(8,10,12,.92);backdrop-filter:blur(10px)}
.header h3{margin:0;font-size:15px;font-weight:800;color:#ff6b6b}
.header span{font-size:10px;background:#1a1e22;border:1px solid #2a2f35;padding:4px 8px;border-radius:20px;color:#7a7f85}
.card{background:linear-gradient(180deg,#1c2126 0%,#161a1e 100%);border:1px solid #23282e;border-radius:18px;padding:16px;margin:12px}
.card-red{border-color:#3a2025;box-shadow:0 0 30px rgba(255,59,74,.12)}
label{display:block;font-size:10px;color:#7a7f85;font-weight:700;letter-spacing:.8px;margin-top:12px;text-transform:uppercase}
input{width:100%;padding:14px;margin-top:6px;border-radius:12px;border:1px solid #2a2f35;background:#0d0f11;color:#fff;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.3}
.btn-kc{background:linear-gradient(90deg,#00ff88,#00cc6a);color:#000}
.btn-dump{background:linear-gradient(90deg,#ff3b4a,#ff1a2e);color:#fff;box-shadow:0 6px 20px rgba(255,59,74,.35);font-size:16px;padding:18px}
.btn-d{background:#242a30;color:#d0d4d8}
.btn-logout{background:#2a1a1e;color:#ff6b7a;border:1px solid #3a2025;padding:6px 12px;font-size:11px;width:auto;border-radius:20px}
.status{padding:12px;border-radius:12px;background:#0d0f11;border:1px solid #22272d;margin-top:10px;font-size:11.5px;white-space:pre-wrap;line-height:1.6;font-family:'JetBrains Mono',monospace;max-height:400px;overflow:auto}
.pill{background:#1e2429;border:1px solid #2a2f35;padding:6px 10px;border-radius:20px;font-size:11px;display:inline-block;margin:3px;font-family:'JetBrains Mono'}
.hidden{display:none!important}
.success{color:#00ff88}.error{color:#ff6b6b}.warn{color:#ffd166}
.check-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:#ffd166;background:#2a2010;border:1px solid #3a2f15;padding:10px;border-radius:10px}
.check-row input{width:18px;height:18px;margin:0}
.log-line{border-bottom:1px solid #1a1e22;padding:6px 0}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h3>⚠️ V5.1 DUMP ALL → HIVE</h3>
<div style="display:flex;gap:6px;align-items:center"><span id="kcDetect">CHECKING...</span><button id="logoutBtn" onclick="doLogout()" class="btn btn-logout hidden">LOGOUT</button></div>
</div>

<div class="card" id="loginCard">
<div id="connectedBar" class="hidden" style="display:flex;justify-content:space-between;align-items:center;background:#0f1a14;border:1px solid #1e3a28;padding:12px 14px;border-radius:12px">
<div><div style="font-size:10px;color:#7a7f85">TERHUBUNG</div><b id="connectedUser">@-</b><div style="font-size:10px;color:#7a7f85">AUTO DUMP MODE</div></div>
<button onclick="doLogout()" class="btn btn-logout">LOGOUT</button>
</div>
<div id="kcSection">
<label>Hive Keychain Login</label>
<input id="user" placeholder="username" autocomplete="off" spellcheck="false">
<button id="kcBtn" onclick="loginKC()" class="btn btn-kc" style="margin-top:10px">🔑 LOGIN KEYCHAIN</button>
<div id="kcStatus" class="status">Mendeteksi Keychain...</div>
</div>
<div id="manualSection" class="hidden">
<label>Manual Login</label>
<input id="userManual" placeholder="username" autocomplete="off" spellcheck="false">
<input id="key" type="password" placeholder="5J... Active Private Key" style="margin-top:8px">
<button id="loadBtn" class="btn btn-d" style="margin-top:10px">HUBUNGKAN MANUAL</button>
</div>
<div id="info" class="status">V5.1 akan menjual SEMUA token menjadi SWAP.HIVE.</div>
</div>

<div class="card card-red hidden" id="dumpCard">
<label>TOKEN AKAN DIJUAL</label>
<div id="dumpList" class="status" style="min-height:60px">Belum scan...</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div style="background:#0d0f11;border:1px solid #2a2f35;padding:10px;border-radius:10px"><div style="font-size:10px;color:#7a7f85">TOTAL TOKEN</div><b id="totalTokens">0</b></div>
<div style="background:#0d0f11;border:1px solid #1e3a28;padding:10px;border-radius:10px"><div style="font-size:10px;color:#7a7f85">EST. HIVE</div><b id="estHive" style="color:#00ff88">0</b></div>
</div>
<div style="background:#0d0f11;border:1px solid #1e3a28;padding:10px;border-radius:10px;margin-top:8px"><div style="font-size:10px;color:#7a7f85">SALDO SWAP.HIVE</div><b id="currentHive" style="font-size:16px">0</b> <span id="hiveDelta" style="font-size:11px;color:#00ff88"></span></div>

<div class="check-row"><input type="checkbox" id="confirmDump"><label for="confirmDump" style="margin:0;text-transform:none;font-size:11px;color:#ffd166">Saya paham ini akan JUAL SEMUA token saya jadi HIVE. Tidak bisa dibatalkan.</label></div>
<div class="check-row" style="background:#0f1a14;border-color:#1e3a28"><input type="checkbox" id="autoStart" checked><label for="autoStart" style="margin:0;text-transform:none;font-size:11px;color:#7a7f85">Auto mulai setelah login (jika tidak dicentang, klik manual)</label></div>

<button id="dumpBtn" class="btn btn-dump" style="margin-top:12px" disabled>🔥 DUMP ALL TO HIVE</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button id="refreshBtn" class="btn btn-d">↻ SCAN ULANG</button>
<button id="stopBtn" class="btn btn-d" style="background:#3a1a1a">⏹ STOP</button>
</div>
</div>

<div class="card">
<label>LIVE LOG - HASIL JUAL</label>
<div id="log" class="status" style="min-height:200px;background:#050607;border-color:#1a1a1a">Menunggu login...</div>
<button onclick="$('log').innerHTML=''" class="btn btn-d" style="margin-top:8px;padding:8px;font-size:11px">CLEAR LOG</button>
</div>
</div>

<script>
const ENGINE_API="https://api.hive-engine.com/rpc/contracts";
hive.api.setOptions({url:"https://api.hive.blog"});
const $=id=>document.getElementById(id);
let account="", activeKey="", ownedMap={}, useKeychain=false, busy=false, stopFlag=false, initialHive=0;
const LS_CONN="he_v51_connected", LS_USER="he_v51_user", LS_MODE="he_v51_mode", LS_AKEY="he_v51_akey";
function clearConn(){localStorage.removeItem(LS_CONN); localStorage.removeItem(LS_USER); localStorage.removeItem(LS_MODE); localStorage.removeItem(LS_AKEY);}
function saveConn(){localStorage.setItem(LS_CONN,"1"); localStorage.setItem(LS_USER,account); localStorage.setItem(LS_MODE,useKeychain?"keychain":"manual"); if(!useKeychain&&activeKey) localStorage.setItem(LS_AKEY,btoa(activeKey));}
function forceLowercase(el){let v=el.value.toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9.-]/g,""); if(el.value!==v) el.value=v;}
$("user").addEventListener("input",function(){forceLowercase(this)}); $("userManual").addEventListener("input",function(){forceLowercase(this)});
function isKC(){return typeof window.hive_keychain!=='undefined'&&window.hive_keychain!==null;}
function setDetect(t,ok){$("kcDetect").textContent=t; $("kcDetect").style.color=ok?"#00ff88":"#ff6b6b";}
function showKC(){if(localStorage.getItem(LS_CONN)) return; $("kcSection").classList.remove("hidden"); $("manualSection").classList.add("hidden"); setDetect("KEYCHAIN OK",true);}
function showManual(){if(localStorage.getItem(LS_CONN)) return; $("kcSection").classList.add("hidden"); $("manualSection").classList.remove("hidden"); setDetect("MANUAL",false);}
function checkKC(){if(localStorage.getItem(LS_CONN)) return; if(isKC()) showKC(); else showManual();}
window.addEventListener('hive_keychain_ready',checkKC);
let tries=0; let iv=setInterval(()=>{tries++; if(isKC()){clearInterval(iv); checkKC();} if(tries>20){clearInterval(iv); checkKC();}},300);
function showConnected(){ $("kcSection").classList.add("hidden"); $("manualSection").classList.add("hidden"); $("connectedBar").classList.remove("hidden"); $("logoutBtn").classList.remove("hidden"); $("connectedUser").textContent="@"+account; $("dumpCard").classList.remove("hidden"); }
function showDisconnected(){ $("connectedBar").classList.add("hidden"); $("logoutBtn").classList.add("hidden"); $("dumpCard").classList.add("hidden"); $("kcSection").classList.remove("hidden"); checkKC(); }
function log(msg, cls=""){let time=new Date().toLocaleTimeString('id-ID'); let div=document.createElement('div'); div.className='log-line '+(cls||''); div.innerHTML=`<span style="color:#555">[${time}]</span> ${msg}`; $("log").appendChild(div); $("log").scrollTop=$("log").scrollHeight;}
async function rpc(m,p){let r=await fetch(ENGINE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",method:m,params:p,id:1})}); let j=await r.json(); if(j.error) throw new Error(j.error.message); return j.result;}
async function loadBalances(){
 let bals=await rpc("find",{contract:"tokens",table:"balances",query:{account},limit:1000});
 ownedMap={}; bals.forEach(i=>ownedMap[i.symbol]=parseFloat(i.balance)||0);
 let hive=ownedMap["SWAP.HIVE"]||0; $("currentHive").textContent=hive.toFixed(8); return ownedMap;
}
function getSellList(){
 return Object.entries(ownedMap).filter(([s,b])=>s!=="SWAP.HIVE"&&b>0.0000001).sort((a,b)=>b[1]-a[1]);
}
async function scanDumpList(){
 let list=getSellList(); $("totalTokens").textContent=list.length;
 if(list.length===0){$("dumpList").innerHTML="Tidak ada token untuk dijual (hanya SWAP.HIVE)"; $("estHive").textContent="0"; return {list:[], est:0};}
 let html=""; let totalEst=0;
 // estimasi cepat pakai buyBook per token
 for(let [sym,bal] of list){
   try{
     let buyBook=await rpc("find",{contract:"market",table:"buyBook",query:{symbol:sym},limit:20,indexes:[{index:"priceDec",descending:true}]});
     let rem=bal; let est=0; for(let o of buyBook){let q=parseFloat(o.quantity)||0,p=parseFloat(o.price)||0; let take=Math.min(rem,q); est+=take*p; rem-=take; if(rem<=0) break;}
     let ok=rem<=0; totalEst+=est;
     html+=`<div style="display:flex;justify-content:space-between"><span>${sym} ${bal}</span><span style="color:${ok?'#00ff88':'#ffd166'}">${est.toFixed(5)} HIVE ${ok?'':'⚠️ tipis'}</span></div>`;
   }catch(e){ html+=`<div>${sym} ${bal} - err</div>`; }
 }
 $("dumpList").innerHTML=html; $("estHive").textContent=totalEst.toFixed(8)+" HIVE";
 return {list, est:totalEst};
}
function broadcast(jsonPayload, onSuccess, onError){
 if(useKeychain&&isKC()){
  window.hive_keychain.requestCustomJson(account, "ssc-mainnet-hive", "Active", jsonPayload, "Hive Engine Dump", function(res){ if(res.success) onSuccess(res); else onError(new Error(res.message)); });
 }else{
  hive.broadcast.customJson(activeKey,[account],[],"ssc-mainnet-hive",jsonPayload,function(err,res){ if(err) onError(err); else onSuccess(res); });
 }
}
async function dumpAll(){
 if(busy) return; if(!$("confirmDump").checked){log("Centang confirm dulu!","error"); return;}
 let sellList=getSellList(); if(sellList.length===0){log("Tidak ada token untuk dijual","warn"); return;}
 stopFlag=false; busy=true; $("dumpBtn").disabled=true; $("dumpBtn").textContent="⏳ DUMPING...";
 initialHive=ownedMap["SWAP.HIVE"]||0;
 log(`MULAI DUMP ${sellList.length} token | HIVE awal ${initialHive.toFixed(8)}`,"warn");
 for(let i=0;i<sellList.length;i++){
   if(stopFlag){log("STOPPED oleh user","error"); break;}
   let [sym,bal]=sellList[i];
   let oldHive=ownedMap["SWAP.HIVE"]||0;
   try{
     let meta=await rpc("findOne",{contract:"tokens",table:"tokens",query:{symbol:sym}});
     let prec=meta?.precision||8;
     let qty=parseFloat(bal.toFixed(prec));
     if(qty<=0){log(`SKIP ${sym} - 0`); continue;}
     log(`SELL ${sym} ${qty} -> sending...`);
     let json=JSON.stringify({contractName:"market",contractAction:"marketSell",contractPayload:{symbol:sym,quantity:qty.toFixed(prec)}});
     await new Promise((resolve,reject)=>{
       broadcast(json, (r)=>{ log(`✓ ${sym} SOLD TX ${r.id?r.id.slice(0,8):'OK'} | ${qty} ${sym} terjual`,"success"); resolve(r); }, (e)=>{ log(`✗ ${sym} GAGAL ${e.message}`,"error"); reject(e); });
     });
     // FAST REFRESH - tunggu 1.5 detik lalu cek
     await new Promise(r=>setTimeout(r,1500));
     await loadBalances();
     let newHive=ownedMap["SWAP.HIVE"]||0;
     let delta=newHive-oldHive;
     $("currentHive").textContent=newHive.toFixed(8);
     $("hiveDelta").textContent=`(+${delta.toFixed(8)})`;
     log(`✓ UPDATED SWAP.HIVE ${oldHive.toFixed(5)} → ${newHive.toFixed(5)} | +${delta.toFixed(8)} HIVE dari ${sym}`,"success");
     // update list sisa
     await new Promise(r=>setTimeout(r,400));
   }catch(e){
     log(`✗ ${sym} ERROR ${e.message}`,"error");
     await new Promise(r=>setTimeout(r,800));
   }
 }
 await loadBalances();
 let finalHive=ownedMap["SWAP.HIVE"]||0;
 let totalPlus=finalHive-initialHive;
 log(`<b>SELESAI DUMP</b> | HIVE ${initialHive.toFixed(8)} → ${finalHive.toFixed(8)} | TOTAL +${totalPlus.toFixed(8)} HIVE`,"success");
 busy=false; $("dumpBtn").disabled=false; $("dumpBtn").textContent="🔥 DUMP ALL TO HIVE";
 await scanDumpList();
}
function loginKC(){
 if(!isKC()){alert("Buka di Keychain Browser"); return;}
 let username=$("user").value.trim().toLowerCase().replace(/\s+/g,""); if(username.length<3){let saved=localStorage.getItem(LS_USER); if(saved) username=saved; else{username=prompt("Username:"); if(!username) return; username=username.toLowerCase().replace(/\s+/g,"");}}
 $("kcBtn").disabled=true; $("kcBtn").textContent="MENUNGGU...";
 window.hive_keychain.requestSignBuffer(username, "login-"+Date.now(), "Posting", async function(res){
  $("kcBtn").disabled=false; $("kcBtn").textContent="🔑 LOGIN KEYCHAIN";
  if(res.success){
   account=username.toLowerCase(); useKeychain=true; activeKey="";
   $("info").textContent="Loading balances...";
   try{await loadBalances(); initialHive=ownedMap["SWAP.HIVE"]||0; saveConn(); showConnected(); log(`LOGIN @${account} | HIVE ${initialHive.toFixed(8)}`,"success"); let data=await scanDumpList(); if($("autoStart").checked && $("confirmDump").checked && data.list.length>0){log("AUTO START aktif, mulai dump dalam 2 detik...","warn"); setTimeout(()=>dumpAll(),2000);} }catch(e){$("info").textContent=e.message; log(e.message,"error");}
  }else{$("kcStatus").textContent="GAGAL: "+res.message;}
 });
}
async function connectManual(){
 let u=($("userManual").value.trim()||$("user").value.trim()).toLowerCase().replace(/\s+/g,""); let k=$("key").value.trim();
 if(u.length<3){$("info").textContent="Username invalid"; return;} if(k.length<40){$("info").textContent="Key invalid"; return;}
 account=u; activeKey=k; useKeychain=false; $("loadBtn").disabled=true;
 try{await loadBalances(); initialHive=ownedMap["SWAP.HIVE"]||0; saveConn(); showConnected(); log(`LOGIN MANUAL @${account} | HIVE ${initialHive.toFixed(8)}`,"success"); let data=await scanDumpList(); if($("autoStart").checked && $("confirmDump").checked && data.list.length>0){log("AUTO START aktif, mulai dump dalam 2 detik...","warn"); setTimeout(()=>dumpAll(),2000);} }catch(e){$("info").textContent=e.message; log(e.message,"error");} finally{$("loadBtn").disabled=false;}
}
function doLogout(){clearConn(); account=""; activeKey=""; useKeychain=false; ownedMap={}; $("user").value=""; $("userManual").value=""; $("key").value=""; showDisconnected(); $("log").innerHTML="Logged out"; $("info").textContent="Logged out"; $("currentHive").textContent="0"; $("dumpList").innerHTML=""; }
$("loadBtn").onclick=connectManual;
$("dumpBtn").onclick=dumpAll;
$("refreshBtn").onclick=async()=>{await loadBalances(); await scanDumpList(); log("SCAN ulang selesai");};
$("stopBtn").onclick=()=>{stopFlag=true; log("STOP diminta...","warn");};
$("confirmDump").onchange=function(){$("dumpBtn").disabled=!this.checked; if(this.checked) $("dumpBtn").style.opacity="1";};
$("user").addEventListener("keydown",e=>{if(e.key==="Enter") loginKC();});

window.addEventListener('load', async()=>{
 if(localStorage.getItem(LS_CONN)&&localStorage.getItem(LS_USER)){
   let savedUser=localStorage.getItem(LS_USER); let savedMode=localStorage.getItem(LS_MODE); let savedAkey=localStorage.getItem(LS_AKEY);
   account=savedUser; if(savedMode==="manual"&&savedAkey){try{activeKey=atob(savedAkey); useKeychain=false;}catch(e){clearConn(); checkKC(); return;}}else{useKeychain=true;}
   let wait=0; while(wait<15&&savedMode==="keychain"&&!isKC()){await new Promise(r=>setTimeout(r,200)); wait++;}
   try{await loadBalances(); initialHive=ownedMap["SWAP.HIVE"]||0; showConnected(); setDetect(savedMode==="keychain"?"KEYCHAIN OK":"MANUAL",savedMode==="keychain"); $("info").innerHTML=`<span class="success">● AUTO CONNECTED</span> @${account} | HIVE ${initialHive.toFixed(8)}`; log(`AUTO CONNECTED @${account}`,"success"); await scanDumpList();}catch(e){$("info").textContent=e.message;}
 }else{checkKC();}
});
</script>
</body>
</html>
